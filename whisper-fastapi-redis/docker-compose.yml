# docker-compose.yml
version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: stt-redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: stt-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /code
    volumes:
      - ./:/code
    environment:
      - REDIS_URL=redis://redis:6379/0
      - WHISPER_MODEL=base
    depends_on:
      - redis
    ports:
      - "8000:8000"

  worker:
    build: .
    container_name: stt-worker
    command: python -u worker/transcriber.py
    working_dir: /code
    volumes:
      - ./:/code
    environment:
      - REDIS_URL=redis://redis:6379/0
      - WHISPER_MODEL=base
    depends_on:
      - redis
