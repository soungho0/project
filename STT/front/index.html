<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>STT 헬스체크(단일 파일)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #fafafa; }
    h1 { margin: 0 0 12px; }
    .row { margin: 10px 0; }
    #log { background:#222; color:#0f0; padding:8px; height:180px; overflow:auto; font-size:13px; }
    #transcript p { margin:6px 0; }
    .muted { color:#666; }
    button { cursor: pointer; }
    .ok { color:#0a0; font-weight:bold; }
    .bad { color:#b00; font-weight:bold; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
</head>
<body>
  <h1>🎙️ 화자분리 STT </h1>

  <div class="row">백엔드 상태: <b id="status" class="muted">확인 중...</b></div>

  <div class="row">
    <input type="file" id="fileInput" accept="audio/*" />
    <button id="btnUpload">업로드 변환</button>
  </div>

  <h3>결과</h3>
  <div id="transcript">(아직 없음)</div>

  <h3>로그</h3>
  <pre id="log" class="mono"></pre>

<script>
/**
 * ✅ API 베이스를 현재 페이지의 프로토콜/호스트로부터 생성 (127.0.0.1 vs localhost 불일치 방지)
 *    필요시 포트만 8000으로 교체
 */
const API = `${location.protocol}//${location.hostname}:8000`;

const $ = (id) => document.getElementById(id);
const log = (m) => { $("log").textContent += m + "\n"; $("log").scrollTop = $("log").scrollHeight; };

function fmt(t){
  const m = String(Math.floor(t/60)).padStart(2,'0');
  const s = String(Math.floor(t%60)).padStart(2,'0');
  return `${m}:${s}`;
}

async function checkServer(){
  try{
    const r = await fetch(`${API}/`, { method: "GET" });
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    $("status").innerHTML = `<span class="ok">✅ 연결됨:</span> ${j.message || "OK"}`;
    log(`[STATUS] GET / → ${r.status} ${r.statusText} | ${JSON.stringify(j)}`);
  }catch(e){
    $("status").innerHTML = `<span class="bad">❌ 연결 실패</span> (백엔드 확인)`;
    log(`[ERROR] 서버 연결 실패: ${e} | online=${navigator.onLine}`);
    log(`API base = ${API}`);
  }
}

async function uploadFile(){
  const f = $("fileInput").files[0];
  if(!f){ alert("오디오 파일을 선택하세요."); return; }

  $("status").textContent = "⏳ 업로드/변환 중...";
  const fd = new FormData();
  fd.append("file", f);

  try{
    const res = await fetch(`${API}/asr/file`, {
      method:"POST",
      body: fd,
      // mode: "cors"  // 기본값이 cors라 생략 가능
    });

    // 에러 본문까지 로깅해서 디버깅 편하게
    if(!res.ok){
      const txt = await safeText(res);
      throw new Error(`HTTP ${res.status} ${res.statusText} | body: ${txt.slice(0,400)}`);
    }

    const json = await res.json();
    if(!json.segments || !json.segments.length){
      $("transcript").innerHTML = "(세그먼트 없음)";
    }else{
      $("transcript").innerHTML = json.segments.map(s =>
        `<p>[${fmt(s.start)}~${fmt(s.end)}] <b>${s.speaker ?? ""}</b> ${escapeHtml(s.text ?? "")}</p>`
      ).join("");
    }
    $("status").innerHTML = `<span class="ok">✅ 완료</span> (${json.language}, ${(json.duration||0).toFixed(1)}s)`;
    log(`[RESULT] segments=${json.segments?.length || 0}`);
  }catch(e){
    $("status").innerHTML = `<span class="bad">❌ 업로드/변환 실패</span>`;
    log(`[ERROR] 업로드 실패: ${e}`);
    log(`힌트:
- 백엔드 콘솔에 "POST /asr/file ..." 로그가 안 찍히면 CORS/URL 문제일 확률 ↑
- /docs 에서도 실패하면 백엔드 라우터/모델 문제일 확률 ↑
- API base = ${API}`);
  }
}

async function ping(){
  // 프리플라이트가 필요한 환경에서 CORS 확인용
  try{
    const r = await fetch(`${API}/asr/file`, {
      method: "OPTIONS",
      headers: { "Access-Control-Request-Method": "POST" }
    });
    log(`[PING] OPTIONS /asr/file → ${r.status} ${r.statusText}`);
  }catch(e){
    log(`[PING ERROR] OPTIONS 실패: ${e}`);
  }
}

async function safeText(res){
  try{ return await res.text(); }catch{ return ""; }
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

window.addEventListener("DOMContentLoaded", ()=>{
  $("btnUpload").onclick = uploadFile;
  $("btnPing").onclick = ping;
  checkServer();
});
</script>
</body>
</html>
